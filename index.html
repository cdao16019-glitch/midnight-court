<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜のコート — Midnight Court</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #e8ecf8;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", Meiryo, sans-serif; }
  #vig { position: absolute; inset: 0;
         background: radial-gradient(ellipse at center, transparent 52%, rgba(3,4,10,0.6) 100%); }
  #title { position: absolute; top: 24px; left: 28px; text-shadow: 0 2px 14px rgba(0,0,0,0.9); }
  #title h1 { font-size: 21px; margin: 0; font-weight: 600; letter-spacing: 0.4em; }
  #title p { font-size: 11px; margin: 7px 0 0; letter-spacing: 0.28em; opacity: 0.72; }
  #hint { position: absolute; bottom: 22px; right: 28px; font-size: 11px; letter-spacing: 0.22em;
          opacity: 0.6; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <div id="vig"></div>
  <div id="title">
    <h1>夜のコート</h1>
    <p>MIDNIGHT COURT ・ 桜の下のバスケットコート</p>
  </div>
  <div id="hint">move your mouse — the blossoms fall ・ マウスを動かすと花びらが舞う</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
